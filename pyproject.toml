[project]
name = "ncm-art"
version = "4.0.0.dev0"
description = "Openwound v4, a local studio for writing with Next-Concept Modeling"
readme = "readme.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Matthew Butler" }]
dependencies = [
    "torch==2.14.1",
    "numpy>=2",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "regex>=2024.11.6",
    "huggingface_hub>=0.26",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
